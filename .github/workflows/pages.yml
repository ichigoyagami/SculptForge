name: Website

on:
  push:
    branches: [main]
    paths: ['website/**', 'docs/guide/**', 'tools/guide/**', 'docs/supporters.txt', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release tags
      # New repositories may not have a stable release tag yet. Always prepare
      # a real guide, rather than passing an empty ref to git diff/archive.
      - name: Prepare user guide
        shell: bash
        run: |
          tag=$(git tag -l 'v[0-9]*' --sort=-v:refname |
            awk 'index($0, "-") == 0 && !found { print; found = 1 }')
          if [ -z "$tag" ]; then
            echo "No stable release tag: building guide from the current commit"
            python3 tools/guide/build_site.py --check
          elif git diff --quiet "$tag" HEAD -- docs/guide tools/guide; then
            echo "Guide sources match $tag: rebuilding from the current commit"
            python3 tools/guide/build_site.py --check
          elif git cat-file -e "$tag:website/guide/index.html" 2>/dev/null &&
               git cat-file -e "$tag:website/sitemap.xml" 2>/dev/null; then
            echo "Using the prebuilt guide from $tag"
            rm -rf website/guide
            git archive "$tag" website/guide website/sitemap.xml | tar -x
          else
            echo "::notice::Release $tag has no prebuilt guide; building the current guide"
            python3 tools/guide/build_site.py --check
          fi
      # The credits page always matches docs/supporters.txt on main.
      - name: Supporters page
        run: python3 tools/guide/build_site.py --supporters
      - name: Use the fork's default Pages domain
        if: github.repository != 'islandmed/SculptForge'
        run: rm -f website/CNAME
      - name: Check Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          errors=$(mktemp)
          configured=false
          if build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2>"$errors"); then
            if [ "$build_type" = workflow ]; then
              configured=true
            fi
          elif grep -q 'HTTP 404' "$errors"; then
            echo "::notice::GitHub Pages has not been configured for this repository"
          else
            cat "$errors" >&2
            rm -f "$errors"
            exit 1
          fi
          rm -f "$errors"
          echo "configured=$configured" >> "$GITHUB_OUTPUT"
          if [ "$configured" != true ]; then
            echo "::notice::Website built; publishing is skipped until Settings > Pages > Source is GitHub Actions"
            {
              echo "### Website built; publishing is not configured"
              echo
              echo "The guide and website files were built. Publishing will be skipped."
              echo
              echo "To publish, open $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/settings/pages"
              echo "and select **GitHub Actions** under **Build and deployment > Source**."
              echo "Then run the Website workflow again."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/configure-pages@v6
        if: steps.pages.outputs.configured == 'true'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website
      - id: deployment
        if: steps.pages.outputs.configured == 'true'
        uses: actions/deploy-pages@v5
      # Tell Bing and the other IndexNow search engines about the pages straight away (key file in website/).
      - name: IndexNow
        if: github.repository == 'islandmed/SculptForge' && steps.deployment.outcome == 'success'
        continue-on-error: true
        run: |
          key=$(basename website/[0-9a-f]*.txt .txt)
          urls=$(grep -o '<loc>[^<]*' website/sitemap.xml | sed 's/<loc>//' | python3 -c "import sys,json; print(json.dumps(sys.stdin.read().split()))")
          sleep 60   # let Pages publish the new files first
          curl -sS -o /dev/null -w 'IndexNow: HTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"sculptforge.app\",\"key\":\"$key\",\"keyLocation\":\"https://sculptforge.app/$key.txt\",\"urlList\":$urls}"

  # A copy at https://islandmed.github.io/ for workplace networks that block domains less than about a month old.
  # It points search engines at sculptforge.app (canonical links, robots.txt) and is skipped until the
  # MIRROR_DEPLOY_KEY secret exists (tools/publish/setup-channels.sh sets it up).
  mirror:
    if: github.repository == 'islandmed/SculptForge'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release tags
      # New repositories may not have a stable release tag yet. Always prepare
      # a real guide, rather than passing an empty ref to git diff/archive.
      - name: Prepare user guide
        shell: bash
        run: |
          tag=$(git tag -l 'v[0-9]*' --sort=-v:refname |
            awk 'index($0, "-") == 0 && !found { print; found = 1 }')
          if [ -z "$tag" ]; then
            echo "No stable release tag: building guide from the current commit"
            python3 tools/guide/build_site.py --check
          elif git diff --quiet "$tag" HEAD -- docs/guide tools/guide; then
            echo "Guide sources match $tag: rebuilding from the current commit"
            python3 tools/guide/build_site.py --check
          elif git cat-file -e "$tag:website/guide/index.html" 2>/dev/null &&
               git cat-file -e "$tag:website/sitemap.xml" 2>/dev/null; then
            echo "Using the prebuilt guide from $tag"
            rm -rf website/guide
            git archive "$tag" website/guide website/sitemap.xml | tar -x
          else
            echo "::notice::Release $tag has no prebuilt guide; building the current guide"
            python3 tools/guide/build_site.py --check
          fi
      - name: Supporters page
        run: python3 tools/guide/build_site.py --supporters
      - name: Push website/ to islandmed/islandmed.github.io
        env:
          KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "No MIRROR_DEPLOY_KEY secret: skipped"; exit 0; fi
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/mirror && chmod 600 ~/.ssh/mirror
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror -o StrictHostKeyChecking=accept-new"
          git clone -q --depth 1 git@github.com:islandmed/islandmed.github.io.git mirror
          rsync -a --delete --exclude .git website/ mirror/
          cd mirror
          rm -f sitemap.xml [0-9a-f]*.txt               # sculptforge.app's sitemap and IndexNow key
          printf 'User-agent: *\nDisallow: /\n' > robots.txt   # the original is sculptforge.app
          touch .nojekyll
          git add -A
          git -c user.name="SculptForge website" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Mirror of website/ at ${GITHUB_SHA::7}" || { echo "No changes"; exit 0; }
          git push -q origin HEAD:main
